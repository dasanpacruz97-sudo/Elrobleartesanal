<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box}
    html{scroll-behavior:smooth}
      body{
            text-align:left;margin:0;background:#0b0704;color:#f2e6c9;
                font-family:"Inter",system-ui,-apple-system,sans-serif;
      }
        a{color:inherit}
          .page{
                min-height:100vh;
                    background:
                          radial-gradient(1200px 600px at 50% -10%, rgba(214,164,90,.18), transparent 60%),
                                repeating-linear-gradient(93deg, #150e07 0 28px, #181009 28px 56px, #120c06 56px 84px),
                                      #0b0704;
          }
            /* NAV */
              nav.topnav{
                    position:sticky;top:0;z-index:40;
                        display:flex;align-items:center;gap:14px;
                            padding:10px 16px;
                                background:rgba(11,7,4,.88);
                                    backdrop-filter:blur(10px);
                                        border-bottom:1px solid rgba(201,164,92,.3);
              }
                .nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
                  .nav-brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid #c9a45c;display:block}
                    .nav-brand b{font-family:"Cinzel",serif;letter-spacing:.1em;font-size:14px;color:#f0d9a0;line-height:1}
                      .nav-brand small{display:block;font-family:"Inter",sans-serif;font-weight:600;font-size:10px;letter-spacing:.22em;color:#a88c5a}
                        .nav-links{display:flex;gap:2px;margin-left:auto}
                          .nav-links a{
                                text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.04em;
                                    padding:8px 12px;border-radius:100px;color:#e8cd8d;
                          }
                          
      }
